[build-system]
requires = ["setuptools>=83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "migration-platform"
version = "0.2.0"
description = "Enterprise SQL Server to PostgreSQL Migration Platform"
requires-python = ">=3.11"
authors = [
    { name = "Migration Platform Team" },
]

dependencies = [
    # Core
    "pydantic>=2.0",
    "structlog>=24.0",
    "cryptography>=42.0",
    "bcrypt>=4.0",
    "PyJWT>=2.8",
    
    # SQL Parsing
    "sqlglot>=25.0",
    
    # Dependency Graph
    "networkx>=3.0",
    
    # Database Drivers
    "pyodbc>=5.0",
    "asyncpg>=0.29",
    "psycopg[binary]>=3.1",
    
    # API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0",
    "alembic>=1.13",
    "aiosqlite>=0.20",
    "greenlet>=3.0",

    # Replication messaging (optional external RabbitMQ; in-process bus is default)
    "aio-pika>=9.4",
    "apscheduler>=3.11.2",
]

[project.optional-dependencies]
full = [
    "pgparse>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "coverage>=7.0",
    "ruff>=0.3",
    "black>=24.0",
    "mypy>=1.8",
    "pre-commit>=3.6",
    "httpx>=0.26",
    "temporalio>=1.7",
]

[tool.setuptools.packages.find]
include = ["migration*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "SIM", "ARG", "C4", "T10"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG"]
"apps/replicator/capture/providers/watermark_provider.py" = ["ARG"]
"apps/replicator/capture/publisher.py" = ["F401"]

[tool.ruff.format]
quote-style = "double"

[tool.black]
line-length = 100
target-version = ["py311"]

[tool.mypy]
python_version = "3.11"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
addopts = "--cov-fail-under=70"

[tool.coverage.run]
source = ["migration"]
omit = ["*/tests/*", "*/__init__.py"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
]
