name: UI Lighthouse

on:
  pull_request:
    paths:
      - "apps/ui/**"
      - ".github/workflows/lighthouse.yml"
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/ui

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Next.js app
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

      - name: Start production server
        run: |
          npm run start -- --port 3508 --hostname 127.0.0.1 &
          echo $! > /tmp/next-ui.pid

      - name: Wait for UI
        run: |
          for i in $(seq 1 45); do
            if curl -sf http://127.0.0.1:3508/login >/dev/null; then
              echo "UI ready"
              exit 0
            fi
            sleep 2
          done
          echo "UI failed to become ready"
          exit 1

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://127.0.0.1:3508/login
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: apps/ui/lighthouserc.json
